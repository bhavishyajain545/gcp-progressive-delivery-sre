apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata:
  name: orders-api
spec:
  selector:
    matchExpressions:   # stable and canary pods (Cloud Deploy relabels the canary)
      - key: app
        operator: In
        values: ["orders-api", "orders-api-canary"]
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
