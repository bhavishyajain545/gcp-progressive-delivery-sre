# Only prod is exposed. Cloud Deploy's canary rewrites the HTTPRoute weights
# between orders-api (stable) and orders-api-canary at 25% / 50% / 100%.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: external
spec:
  gatewayClassName: gke-l7-global-external-managed
  listeners:
    - name: http
      protocol: HTTP
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: orders-api
spec:
  parentRefs:
    - name: external
  rules:
    - backendRefs:
        - name: orders-api
          port: 80
